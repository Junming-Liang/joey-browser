<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>城之内原版 · 修复预览</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header><strong>城之内原版 · 修复预览</strong><span id="version">正在检查版本</span></header>
<main id="game">
<div id="launch"><p id="download-size">横屏后点击启动。默认只准备常用资源，未缓存内容后续按需下载，再次启动复用本机缓存。游戏声音会在启动后开启。</p><p>点击对应位置操作，按住卡片可拖动。右键按钮会作用于最后点击的位置。</p>
<details id="collection-options"><summary>全卡解锁与全部 45 套卡组</summary><label><input id="unlock-cards" type="checkbox" checked> 解锁原版全部 771 种卡片，每种至少 3 张</label><label for="preset-deck">启动时使用的卡组</label><select id="preset-deck"><option value="">自动（首次使用补血削血）</option></select><p id="collection-status">全部卡组会安装到游戏内“卡组编辑 → 读取”列表，之后可随时切换。</p><button id="restore-collection" type="button" disabled>恢复解锁前存档</button><button id="restore-deck" type="button" disabled>恢复切换前卡组</button></details>
<label><input id="complete-resources" type="checkbox"> <span id="complete-label">启动前安装完整压缩资源</span></label>
<label id="resource-quality-option" hidden>完整资源画质 <select id="complete-quality" disabled><option value="light">轻量（卡图与声音轻度压缩）</option><option value="original">原画原声</option></select></label><p id="complete-quality-note" hidden></p><button id="start" disabled>准备中</button></div>
<div id="game-surface" aria-label="原版游戏画面"></div>
<div id="loading" hidden><label id="loading-label" for="loading-progress">准备游戏</label><progress id="loading-progress" aria-labelledby="loading-label"></progress></div>
<p id="status" role="status">修复预览，尚未完成全部功能验证</p><button id="copy-error" hidden>复制运行信息</button>
<details id="startup-details" hidden><summary>查看运行信息</summary><pre id="startup-report"></pre></details>
<details id="failure-details" hidden><summary>查看错误信息</summary><pre id="failure-report"></pre></details>
<nav id="controls" aria-label="手机辅助操作"><button data-key="Enter" disabled>回车</button><button data-key="Space" disabled>空格</button><button data-key="Escape" disabled>返回 Esc</button><button id="right-click" disabled>右键</button><button id="keyboard" disabled>键盘</button><button id="sound" disabled>恢复声音</button><button id="fullscreen">全屏</button></nav>
<input id="keyboard-input" aria-label="卡组名称键盘输入" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
</main><script type="module" src="./app.mjs"></script></body></html>
